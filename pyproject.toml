[project]
name = "motor-sbi"
version = "0.1.0"
description = "Simulation-based inference for motor-adaptation models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The simulators live outside the package but are installed alongside it.
packages = ["src/motor_sbi", "simulators"]

# ---------------------------------------------------------------- pixi

[tool.pixi.workspace]
channels = ["conda-forge"]
# CUDA 12 JAX builds; the driver must support CUDA >= 12.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12" }]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
matplotlib = "*"
# Fast-moving Bayesian/ML stack: pinned to a minor version; update deliberately.
jax = "0.10.*"
jaxlib = { version = "0.10.*", build = "*cuda*" }
keras = "3.15.*"
pymc = "6.3.*"
arviz = "1.3.*"
# Notebooks and tooling
jupyterlab = "*"
ipykernel = "*"
pytest = "*"
ruff = "*"

[tool.pixi.pypi-dependencies]
bayesflow = "==2.0.14"
motor-sbi = { path = ".", editable = true }

[tool.pixi.activation.env]
KERAS_BACKEND = "jax"

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
lab = "jupyter lab"

# ---------------------------------------------------------------- tools

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# PEP 8 naming (N), on top of ruff's defaults.
extend-select = ["N"]

[tool.ruff.lint.pep8-naming]
# Symbols of a Model's equations keep their case, alone or as a suffix (AGENTS.md).
ignore-names = ["A", "B", "*_A", "*_B"]
